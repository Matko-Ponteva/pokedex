name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        run: docker compose --profile full up --build --detach

      - name: Wait for the app
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          echo "The app did not become healthy in time"
          exit 1

      - name: Install the Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Show the container logs
        if: failure()
        run: docker compose --profile full logs

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7